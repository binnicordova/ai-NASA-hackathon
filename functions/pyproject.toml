[project]
name = "fire-calendar-functions"
version = "0.1.0"
description = "Servicios headless del calendario de quema: leen la serie armonizada y responden JSON/CSV a cualquier cliente."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "duckdb>=1.1", "h3>=4.1"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fire_calendar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
