<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NASAT · Harmonization of MODIS and VIIRS Hot Spots: calendario de quema del Perú con focos de calor de NASA FIRMS armonizados, de 2000 a hoy.">
  <script>
    // Tema elegido por la persona (claro u oscuro), aplicado antes de pintar para que no parpadee.
    try { const theme = localStorage.getItem('nasat-theme'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme; } catch { /* sin almacenamiento: tema del sistema */ }
  </script>
  <title>NASAT · Calendario de quema</title>
  <link rel="icon" type="image/png" href="/brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@700;900&family=Overpass:ital,wght@0,400;0,700;1,400&display=swap">
</head>
<body>
<div class="app">

  <header class="panel top">
    <div class="brand">
      <h1><img class="brand-nasat" src="/brand/nasat.png" alt="NASAT" width="198" height="96"></h1>
      <p class="brand-sub hide-narrow" data-i18n="app.subtitle"></p>
    </div>
    <!-- Caso de muestra: el video de 30 s y el recorrido por Sicuani. Se abre solo en la primera visita. -->
    <button type="button" class="btn tour-btn" id="tourOpen" data-i18n-aria="tour.open.aria" data-i18n-title="tour.open.aria"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span class="hide-narrow" data-i18n="tour.open"></span></button>
    <div class="row top-actions">
      <div class="seg" role="group" data-i18n-aria="metric.group">
        <button type="button" data-metric="harmonized" aria-pressed="true" data-i18n="metric.harmonized" data-i18n-title="metric.harmonized.tip"></button>
        <button type="button" data-metric="hotspots" aria-pressed="false" data-i18n="metric.hotspots" data-i18n-title="metric.hotspots.tip"></button>
        <button type="button" data-tab="risk" aria-pressed="false" data-i18n="metric.risk" data-i18n-title="metric.risk.tip"></button>
      </div>
      <button type="button" class="btn icon theme-btn" id="themeSwitch" aria-pressed="false">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button type="button" class="btn" id="langSwitch" data-i18n="lang.switch"></button>
    </div>
    <a class="brand-sa" href="https://www.spaceappschallenge.org/2026/challenges/modis-and-viirs-hot-spots/" target="_blank" rel="noopener"><img src="/brand/space-apps.svg" alt="NASA Space Apps Challenge 2026" width="102" height="40"></a>
  </header>

  <details class="panel filters" id="filters" open>
    <summary><h2 data-i18n="filters.title"></h2></summary>
    <button type="button" class="btn full reset-btn" id="resetFilters" data-i18n-title="reset.tip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg><span data-i18n="reset"></span></button>

    <div id="areaPicker">
    <label class="field" for="department" data-i18n="area.label"></label>
    <select id="department"><option value="" data-i18n="area.country"></option></select>
    <label class="field" for="province" data-i18n="area.province"></label>
    <select id="province" disabled><option value="" data-i18n="area.wholeDept"></option></select>
    <label class="field" for="district" data-i18n="area.district"></label>
    <select id="district" disabled><option value="" data-i18n="area.wholeProv"></option></select>
    <p class="muted small" id="limitsNote" data-i18n="area.official"></p>
    </div>

    <p class="field" data-i18n="area.own"></p>
    <div class="draw-tools" role="group" data-i18n-aria="area.drawGroup">
      <button type="button" class="btn" data-draw="box" aria-pressed="false"><svg class="draw-icon" viewBox="0 0 24 18" aria-hidden="true"><rect x="2" y="2" width="20" height="14" rx="1"/></svg><span data-i18n="draw.box"></span></button>
      <button type="button" class="btn" data-draw="polygon" aria-pressed="false"><svg class="draw-icon" viewBox="0 0 24 18" aria-hidden="true"><polygon points="3,15 2,6 10,2 21,5 18,16"/><circle cx="3" cy="15" r="1.6"/><circle cx="2" cy="6" r="1.6"/><circle cx="10" cy="2" r="1.6"/><circle cx="21" cy="5" r="1.6"/><circle cx="18" cy="16" r="1.6"/></svg><span data-i18n="draw.polygon"></span></button>
      <button type="button" class="btn" data-draw="freehand" aria-pressed="false"><svg class="draw-icon" viewBox="0 0 24 18" aria-hidden="true"><path d="M3 10C3 3 12 1 17 4s5 10-2 11-11 2-12-5z"/></svg><span data-i18n="draw.freehand"></span></button>
    </div>
    <form id="coords" class="coords" novalidate>
      <label><span data-i18n="area.north"></span><input id="north" inputmode="decimal" placeholder="-11.2" autocomplete="off"></label>
      <label><span data-i18n="area.south"></span><input id="south" inputmode="decimal" placeholder="-15.5" autocomplete="off"></label>
      <label><span data-i18n="area.west"></span><input id="west" inputmode="decimal" placeholder="-74.0" autocomplete="off"></label>
      <label><span data-i18n="area.east"></span><input id="east" inputmode="decimal" placeholder="-70.3" autocomplete="off"></label>
      <button type="submit" class="btn full" data-i18n="area.use"></button>
    </form>
    <p class="note error" id="coordsError" role="alert" hidden></p>

    <p class="field not-risk" data-i18n="dates.label"></p>
    <div class="stack not-risk">
      <label class="date-field" for="from"><span data-i18n="dates.start"></span><input type="date" id="from"></label>
      <label class="date-field" for="to"><span data-i18n="dates.end"></span><input type="date" id="to"></label>
    </div>

    <div class="not-risk">
    <p class="field" data-i18n="dl.title"></p>
    <a class="btn full" id="dlHotspots" href="#" download data-i18n="dl.hotspots"></a>
    <p class="muted small" data-i18n="dl.hotspots.hint"></p>
    <a class="btn full gap" id="dlCells" href="#" download data-i18n="dl.cells"></a>
    <p class="muted small" data-i18n="dl.cells.hint"></p>
    <a class="btn full gap" id="dlSeries" href="#" download data-i18n="dl.series"></a>
    <p class="muted small" data-i18n="dl.series.hint"></p>
    <p class="muted small gap" data-i18n="dl.images"></p>
    </div>
  </details>

  <main class="map-wrap">
    <div id="map" data-i18n-aria="map.label"></div>
    <div class="view-tools" role="toolbar" data-i18n-aria="view.group">
      <button type="button" class="btn icon view-btn" id="viewMapOnly" aria-pressed="false" data-i18n-title="view.mapOnly" data-i18n-aria="view.mapOnly"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      <button type="button" class="btn icon view-btn" id="viewMenuButton" aria-expanded="false" aria-controls="viewMenu" data-i18n-title="view.panels" data-i18n-aria="view.panels"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16"/></svg></button>
      <div class="panel view-menu" id="viewMenu" hidden>
        <p class="small"><strong data-i18n="view.show"></strong></p>
        <label><input type="checkbox" data-view="filters"> <span data-i18n="view.filters"></span></label>
        <label class="not-raw"><input type="checkbox" data-view="stats"> <span data-i18n="view.stats"></span></label>
        <label class="not-risk"><input type="checkbox" data-view="range"> <span data-i18n="view.range"></span></label>
      </div>
    </div>
    <button type="button" class="btn panel exit-map-only" id="exitMapOnly" hidden data-i18n="view.exit"></button>
    <div class="map-tools">
      <label class="map-toggle panel" id="overlayToggle"><input type="checkbox" id="overlay"> <span data-i18n="map.overlay"></span></label>
      <div class="map-toggle panel buffer-toggle" id="bufferToggle" hidden>
        <span class="muted" data-i18n="buffers.label"></span>
        <span class="seg" role="group" data-i18n-aria="buffers.label">
          <button type="button" data-buffers="dissolve" aria-pressed="true" data-i18n="buffers.dissolve" data-i18n-title="buffers.dissolve.tip"></button>
          <button type="button" data-buffers="overlap" aria-pressed="false" data-i18n="buffers.overlap" data-i18n-title="buffers.overlap.tip"></button>
        </span>
      </div>
    </div>
    <div class="map-legend panel" id="mapLegend" hidden>
      <div id="legendHex">
        <p data-i18n="map.key.hex"></p>
        <p class="row hex-scale"><span id="hexLow"></span><span class="row hex-steps" id="hexSteps"></span><span id="hexHigh"></span></p>
      </div>
      <div id="legendRisk" hidden>
        <p id="legendRiskTitle"></p>
        <p class="row risk-scale" id="riskSteps"></p>
        <p class="muted" data-i18n="map.key.risk.none"></p>
      </div>
      <p class="row" id="legendPoint"><span class="point-key"></span><span id="legendPointText"></span></p>
      <p id="mapLegendText"></p>
    </div>
    <p class="map-hint panel" id="drawHint" hidden></p>
    <p class="status panel" id="status" role="status" hidden></p>
  </main>

  <aside class="panel stats">
    <!-- Área y rango una sola vez, arriba: todas las tarjetas de abajo se refieren a esto. -->
    <p class="scope-bar" data-risk><strong id="scopeArea"></strong><span id="scopeRange"></span></p>
    <section class="card risk-card" id="riskCard" data-risk aria-labelledby="riskTitle">
      <div class="row between"><h3 id="riskTitle"></h3><span class="chip static" data-i18n="risk.badge"></span></div>
      <p class="small muted risk-intro" id="riskIntro"></p>
      <div class="row between risk-month">
        <button type="button" class="btn icon" id="riskPrev" data-i18n-aria="risk.prev">‹</button>
        <strong id="riskMonthLabel"></strong>
        <button type="button" class="btn icon" id="riskNext" data-i18n-aria="risk.next">›</button>
      </div>
      <p class="small muted risk-also" id="riskAlso" hidden></p>
      <div class="risk-hero" id="riskHero">
        <span class="row risk-badges"><span class="risk-level-badge" id="riskLevelBadge" data-i18n-title="risk.prob.tip"></span><span class="risk-impact-badge" id="riskImpactBadge" data-i18n-title="risk.impact.tip" hidden></span></span>
        <p class="risk-big"><b id="riskExpected">–</b><span id="riskExpectedLabel"></span></p>
        <p class="risk-summary" id="riskSummary"></p>
        <!-- La historia detrás de la cifra: ese mes, año por año, con el rango del 80 % como franja. -->
        <div class="risk-history" id="riskHistory" role="img">
          <div class="risk-history-bars" id="riskHistoryBars"></div>
          <div class="risk-history-axis small"><span id="riskHistoryFrom"></span><span id="riskHistoryLabel"></span><span class="risk-history-key" data-i18n="risk.history.key"></span><span id="riskHistoryTo"></span></div>
        </div>
        <p class="small risk-last" id="riskLast" hidden></p>
      </div>
      <div class="kpis">
        <div class="kpi" data-i18n-title="risk.range.tip"><span data-i18n="risk.range"></span><b id="riskRange">–</b></div>
        <div class="kpi" data-i18n-title="risk.hits.tip"><span data-i18n="risk.hits"></span><b id="riskHits">–</b></div>
        <div class="kpi" id="riskTested"><span data-i18n="risk.tested"></span><b id="riskTestedValue">–</b></div>
      </div>
      <h4 class="risk-year-title" id="riskYearTitle"></h4>
      <p class="small" id="riskYearSummary"></p>
      <div class="risk-months" id="riskMonths" role="group" data-i18n-aria="risk.months"></div>
      <div id="riskTopBlock">
        <h4 id="riskTopTitle"></h4>
        <ol class="risk-top" id="riskTop"></ol>
      </div>
      <p class="small" id="riskCheck"></p>
      <p class="note" data-i18n="risk.note"></p>
    </section>
    <section class="card raw-card" id="rawCard" hidden aria-labelledby="rawTitle">
      <div class="row between"><h3 id="rawTitle" data-i18n="raw.title"></h3><span class="chip static" data-i18n="raw.badge"></span></div>
      <div class="kpis">
        <div class="kpi hl" data-i18n-title="raw.events.tip"><span data-i18n="raw.events"></span><b id="rawEventCount">–</b></div>
        <div class="kpi"><span data-i18n="raw.total"></span><b id="rawTotal">–</b></div>
        <div class="kpi" data-i18n-title="raw.hexagons.tip"><span data-i18n="raw.hexagons"></span><b id="rawHexagons">–</b></div>
      </div>
      <p class="muted small" id="rawDaysLine"></p>
      <div class="raw-bars" id="rawBars"></div>
      <p class="small" id="rawFrp"></p>
      <div class="raw-events" id="rawEvents">
        <h4 data-i18n="ev.title"></h4>
        <div class="kpis">
          <div class="kpi"><span data-i18n="ev.ratio"></span><b id="evTotal">–</b></div>
          <div class="kpi"><span data-i18n="ev.perDay"></span><b id="evPerDay">–</b></div>
          <div class="kpi"><span data-i18n="ev.busiest"></span><b id="evBusiest">–</b></div>
        </div>
        <svg id="evChart" viewBox="0 0 324 76" role="img" data-i18n-aria="ev.chart"></svg>
        <p class="muted small" id="evChartText"></p>
        <div id="evSizes"></div>
        <p class="small" id="evLargest"><span id="evLargestText"></span> <button type="button" class="link" id="evLargestGo" data-i18n="ev.go"></button></p>
        <p class="muted small" data-i18n="ev.note"></p>
      </div>
      <p class="note" data-i18n="raw.note"></p>
    </section>
    <p class="muted" data-risk><span data-i18n="month.title"></span> · <strong id="monthLabel"></strong></p>
    <p class="verdict" id="verdict" data-risk hidden></p>
    <div class="kpis">
      <div class="kpi"><span id="monthValueLabel"></span><b id="monthValue">–</b></div>
      <div class="kpi"><span data-i18n="kpi.ratio"></span><b id="monthRatio">–</b></div>
      <div class="kpi"><span data-i18n="kpi.percentile"></span><b id="monthPercentile">–</b></div>
    </div>
    <p class="note" id="monthNote" data-risk hidden></p>

    <div id="rangeCard">
      <h2 class="section" data-i18n="range.title"></h2>
      <div class="kpis">
        <div class="kpi"><span data-i18n="kpi.harmonized"></span><b id="rangeHarmonized">–</b></div>
        <div class="kpi" data-i18n-title="raw.hexagons.tip"><span data-i18n="raw.hexagons"></span><b id="rangeHexagons">–</b></div>
        <div class="kpi"><span data-i18n="kpi.days"></span><b id="rangeDays">–</b></div>
      </div>
      <p class="muted small" id="peakSeason"></p>
    </div>

    <section class="card not-raw">
      <div class="row between"><h3 data-i18n="freq.title"></h3><button type="button" class="btn mini" data-png="frequencyChart" data-png-title="freq.title" data-png-text="frequencyText" data-i18n="png" data-i18n-title="png.tip"></button></div>
      <svg id="frequencyChart" viewBox="0 0 324 150" role="img" data-i18n-aria="freq.title"></svg>
      <p class="muted small row wrap" id="levelLegend"></p>
      <p class="small" id="frequencyText"></p>
      <p class="muted small" data-i18n="freq.note"></p>
    </section>

    <section class="card">
      <div class="row between"><h3><span data-i18n="years.title"></span> <span class="muted" id="yearsUnit"></span></h3><button type="button" class="btn mini" data-png="yearsChart" data-png-title="years.title" data-png-text="yearsText" data-i18n="png" data-i18n-title="png.tip"></button></div>
      <svg id="yearsChart" viewBox="0 0 324 160" role="img" data-i18n-aria="years.title"></svg>
      <p class="muted small" id="yearsText"></p>
    </section>

    <section class="card">
      <div class="row between">
        <h3 id="yearDetailTitle"></h3>
        <span class="row"><button type="button" class="btn icon" id="yearPrev" data-i18n-aria="detail.prev">‹</button><button type="button" class="btn icon" id="yearNext" data-i18n-aria="detail.next">›</button><button type="button" class="btn mini" data-png="yearDetailChart" data-png-title-id="yearDetailTitle" data-png-text="yearDetailText" data-i18n="png" data-i18n-title="png.tip"></button></span>
      </div>
      <svg id="yearDetailChart" viewBox="0 0 324 150" role="img" aria-labelledby="yearDetailTitle"></svg>
      <p class="muted small row wrap">
        <span class="row"><span class="swatch line viirs"></span><span data-i18n="lg.thisYear"></span></span>
        <span class="row"><span class="swatch dash"></span><span data-i18n="lg.median"></span></span>
        <span class="row"><span class="swatch usual"></span><span data-i18n="lg.usual"></span></span>
      </p>
      <p class="small" id="yearDetailText"></p>
    </section>

    <section class="card plain" id="calendarCard">
      <div class="row between"><h3 data-i18n="cal.title"></h3><span class="row"><button type="button" class="btn mini" id="calendarPng" data-i18n="png" data-i18n-title="png.tip"></button><button type="button" class="btn mini" id="expand" data-i18n="cal.numbers"></button></span></div>
      <div class="cal" id="heatmap" role="group" data-i18n-aria="cal.title"></div>
      <p class="muted small row wrap"><span data-i18n="cal.low"></span> <span class="row ramp" id="ramp"></span> <span data-i18n="cal.high"></span>
        <span class="row"><span class="swatch dash"></span><span data-i18n="cal.modis"></span></span></p>
    </section>

    <section class="card" id="beforeAfterCard">
      <div class="row between"><h3 data-i18n="ba.title"></h3><button type="button" class="btn mini" data-png="beforeAfterChart" data-png-title="ba.title" data-png-text="validationText" data-i18n="png" data-i18n-title="png.tip"></button></div>
      <svg id="beforeAfterChart" viewBox="0 0 324 190" role="img" data-i18n-aria="ba.title"></svg>
      <p class="muted small" id="validationText"></p>
    </section>

    <section class="card">
      <h3 data-i18n="rank.title"></h3>
      <table class="ranking">
        <thead><tr><th scope="col">#</th><th scope="col" data-i18n="rank.dept"></th>
          <th scope="col" data-sort="hexagons"><button type="button" class="sort" data-sort-key="hexagons"><span data-i18n="rank.hexagons"></span></button></th>
          <th scope="col" data-sort="hotspots"><button type="button" class="sort" data-sort-key="hotspots"><span data-i18n="rank.hotspots"></span></button></th>
          <th scope="col" data-sort="events" class="hl"><button type="button" class="sort" data-sort-key="events"><span data-i18n="rank.events"></span></button></th></tr></thead>
        <tbody id="rankingBody"></tbody>
      </table>
      <button type="button" class="link small" id="rankingMore"></button>
      <p class="muted small" data-i18n="rank.note"></p>
    </section>

    <section class="card plain" data-risk>
      <h3 data-i18n="about.title"></h3>
      <ul class="muted small" id="caveats"></ul>
      <p class="muted small" id="source"></p>
    </section>
  </aside>

  <section class="panel range" id="timeline" aria-labelledby="rangeTitle">
    <div class="row between wrap range-head">
      <p class="small"><span class="muted" id="rangeTitle" data-i18n="dates.label"></span> · <strong id="rangeText"></strong></p>
      <div class="row wrap">
        <button type="button" class="chip" data-quick="all" data-i18n="quick.all"></button>
        <button type="button" class="chip" data-quick="7" data-i18n="quick.7"></button>
        <button type="button" class="chip" data-quick="30" data-i18n="quick.30"></button>
        <button type="button" class="chip" data-quick="5" data-i18n="quick.5"></button>
        <button type="button" class="chip" data-quick="1" data-i18n="quick.1"></button>
        <button type="button" class="chip" data-quick="viirs" data-i18n="quick.viirs"></button>
      </div>
    </div>
    <div class="row between wrap brush-tools">
      <span class="muted small"><span id="brushView"></span> · <span class="hide-narrow" data-i18n="brush.hint"></span></span>
      <span class="row" role="group" data-i18n-aria="zoom.group">
        <button type="button" class="btn icon" id="zoomOut" data-i18n-aria="zoom.out" data-i18n-title="zoom.out">−</button>
        <button type="button" class="btn icon" id="zoomIn" data-i18n-aria="zoom.in" data-i18n-title="zoom.in">+</button>
        <button type="button" class="btn mini" id="zoomFit" data-i18n="zoom.fit"></button>
        <button type="button" class="btn mini" id="zoomAll" data-i18n="zoom.all"></button>
      </span>
    </div>
    <div id="brush" class="brush"></div>
  </section>
</div>

<dialog id="calendarDialog" aria-labelledby="calendarDialogTitle">
  <div class="row between"><h2 id="calendarDialogTitle"></h2><span class="row"><button type="button" class="btn" id="calendarPngDialog" data-i18n="png" data-i18n-title="png.tip"></button><form method="dialog"><button class="btn" data-i18n="close"></button></form></span></div>
  <p class="muted small" id="calendarDialogNote"></p>
  <div class="table-scroll"><table class="full-cal" id="fullCalendar"></table></div>
</dialog>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
